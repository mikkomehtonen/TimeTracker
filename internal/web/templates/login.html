<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in – TimeTracker</title>
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>TimeTracker</h1>
    <h2>Sign in</h2>
    {{if .Flash}}<p class="flash flash-{{.FlashKind}}" role="status">{{.Flash}}</p>{{end}}
    <form method="post" action="/login">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" maxlength="50" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit" class="button button-primary">Sign in</button>
    </form>
    <p class="auth-alt">No account yet? <a href="/register">Create account</a></p>
  </main>
</body>
</html>
