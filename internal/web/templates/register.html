<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account – TimeTracker</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>TimeTracker</h1>
    <h2>Create account</h2>
    {{if .Flash}}<p class="flash flash-{{.FlashKind}}" role="status">{{.Flash}}</p>{{end}}
    <form method="post" action="/register">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" maxlength="50" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <button type="submit" class="button button-primary">Create account</button>
    </form>
    <p class="auth-alt">Already registered? <a href="/login">Sign in</a></p>
  </main>
</body>
</html>
