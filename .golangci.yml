version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  tests: true

linters:
  default: none
  enable:
    - cyclop
    - errcheck
    - errorlint
    - funlen
    - gocognit
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  settings:
    cyclop:
      max-complexity: 12
    gocognit:
      min-complexity: 15
    funlen:
      lines: 80
      statements: 50
      ignore-comments: false

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - example.com/timetracker
