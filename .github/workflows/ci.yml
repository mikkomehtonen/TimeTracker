name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: dependabot
      - name: Install Node
        # frontend_test runs the real app.js under Node; pin it so the JS
        # contract assertions cannot silently skip in CI.
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install tools
        run: make tools
      - name: Check
        run: make check
